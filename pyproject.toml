[tool.uv.sources]
gvf = { git = "https://github.com/Guilou001/gv-fintools", tag = "v0.2.1" }

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "lic"
version = "0.1.0"
description = "ALM d'assurance vie sous le TSAV : immunisation de Redington testée en forme fermée, module de risque de taux du LICAT 2025 recalculé à la main, surplus d'un bloc de rentes à travers le choc de taux 2020-2026."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Guillaume Vaudescal" }]
requires-python = ">=3.12,<3.13"
dependencies = [
  "gvf[figures]>=0.2.1",
  "numpy>=1.26",
  "pandas>=2.2",
  "matplotlib>=3.9",
  "openpyxl>=3.1",
  "typer>=0.12",
  "requests>=2.32",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
lic = "lic.cli:app"

[project.urls]
Repository = "https://github.com/Guilou001/17-alm-assurance-vie"

[tool.hatch.build.targets.wheel]
packages = ["src/lic"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B008"]
